name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd ProjectBackend
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio

      - name: Lint with Flake8
        run: |
          cd ProjectBackend
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Backend Schemas
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock-groq-key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock-gemini-key' }}
          MONGO_URI: mongodb://localhost:27017
          DATABASE_NAME: test_homeplanner
        run: |
          cd ProjectBackend
          python -c "import src.models; print('Pydantic models validated successfully')"

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ProjectFrontnd/package.json

      - name: Install Frontend Dependencies
        run: |
          cd ProjectFrontnd
          npm ci || npm install

      - name: Build Vite Distribution
        run: |
          cd ProjectFrontnd
          npm run build
